
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | PhishKavach</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f8fc;
            font-family: 'DM Sans', sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border: 1px solid #e5eaf1;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 15px 45px rgba(20, 40, 70, 0.07);
        }

        .logo {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: #eaf2ff;
            color: #2563eb;
            font-size: 25px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 25px;
            color: #17243a;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #344054;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dce3ed;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #3979e8;
            box-shadow: 0 0 0 3px rgba(57, 121, 232, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            color: #dc2626;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">🛡️</div>

        <h1>Administrator Login</h1>
        

        <form id="adminLoginForm">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" id="loginButton">
                Sign In
            </button>
        </form>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to PhishKavach
        </a>
    </div>

    <script type="module">
        import { supabase } from "./admin-supabase-client.js";

        const form = document.getElementById("adminLoginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Verifying...";
            message.textContent = "";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                const { data: admin, error: adminError } = await supabase
                    .from("admin_users")
                    .select("user_id")
                    .eq("user_id", data.user.id)
                    .maybeSingle();

                if (adminError) throw adminError;

                if (!admin) {
                    await supabase.auth.signOut();
                    throw new Error("Access denied. This account is not an administrator.");
                }

                window.location.href = "admin.html";

            } catch (error) {
                message.textContent = error.message;
                button.disabled = false;
                button.textContent = "Sign In";
            }
        });
    </script>

</body>
</html>
